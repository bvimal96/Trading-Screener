<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIFTY Live Screener</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}.top{background:#111827;color:white;padding:15px;position:sticky;top:0}.wrap{padding:10px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.card{background:white;padding:12px;border-radius:10px}.big{font-size:20px;font-weight:bold}.muted{font-size:11px;color:#667085}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}select,input,button{padding:9px;border:1px solid #ddd;border-radius:7px;background:white}.table{overflow:auto;background:white;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:12px}th:first-child,td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}.buy{color:#087443;font-weight:bold}.sell{color:#b42318;font-weight:bold}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="top"><b>⚡ NIFTY Live Breakout Screener</b><div style="font-size:11px">Yahoo Finance • NIFTY 50 • BANKNIFTY • NSE F&O</div></div>
<div class="wrap"><div class="cards"><div class="card"><span class="muted">Universe</span><div id="u" class="big">—</div></div><div class="card"><span class="muted">Signals</span><div id="n" class="big">—</div></div><div class="card"><span class="muted">BUY</span><div id="b" class="big buy">—</div></div><div class="card"><span class="muted">SELL</span><div id="s" class="big sell">—</div></div></div>
<div class="controls"><select id="st"><option value="">All strategies</option><option>Rolling 2-Day</option><option>Weekly High/Low</option><option>Weekly ORB</option><option>Monthly ORB</option></select><select id="sd"><option value="">BUY + SELL</option><option>BUY</option><option>SELL</option></select><input id="q" placeholder="Search symbol"><button onclick="refresh()">Refresh</button></div>
<div class="table"><table><thead><tr><th>Symbol</th><th>Strategy</th><th>Side</th><th>Entry</th><th>LTP</th><th>SL</th><th>Target</th><th>Range</th><th>Reference</th></tr></thead><tbody id="tb"></tbody></table></div>
<p style="font-size:11px;color:#667085">Yahoo/yfinance prototype. Verify signals in your trading terminal. No orders are placed.</p></div>
<script>
let d=[];async function load(){let p=new URLSearchParams();if(st.value)p.set('strategy',st.value);if(sd.value)p.set('side',sd.value);d=(await (await fetch('/api/signals?'+p)).json()).data||[];render();let x=await (await fetch('/api/status')).json();u.textContent=x.universe;n.textContent=x.signals;b.textContent=d.filter(x=>x.side==='BUY').length;s.textContent=d.filter(x=>x.side==='SELL').length}
function render(){let x=q.value.toUpperCase();tb.innerHTML=d.filter(r=>!x||r.symbol.includes(x)||r.name.toUpperCase().includes(x)).map(r=>`<tr><td><b>${r.symbol}</b></td><td>${r.strategy}</td><td class="${r.side==='BUY'?'buy':'sell'}">${r.side}</td><td>${r.entry}</td><td><b>${r.ltp}</b></td><td>${r.sl}</td><td>${r.target}</td><td>${r.range}</td><td>${r.reference}</td></tr>`).join('')}
async function refresh(){await fetch('/api/refresh',{method:'POST'});load()}st.onchange=load;sd.onchange=load;q.oninput=render;load();setInterval(load,60000)
</script></body></html>
